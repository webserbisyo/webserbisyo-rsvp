<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c96b48" />
    <title>Offline | WebSerbisyo RSVP</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fffaf4;
        --card: rgba(255, 255, 255, 0.92);
        --border: rgba(213, 187, 164, 0.42);
        --brand: #c96b48;
        --brand-deep: #9f4d31;
        --ink: #1f1a17;
        --muted: #78675d;
        --shadow: 0 24px 60px rgba(120, 84, 58, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family:
          "SF Pro Display",
          "Segoe UI",
          "Helvetica Neue",
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 229, 208, 0.78), transparent 48%),
          linear-gradient(180deg, #fffdf9 0%, var(--bg) 42%, #fff4ea 100%);
        color: var(--ink);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
      }

      .card {
        width: min(100%, 430px);
        border-radius: 30px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: var(--shadow);
        padding: 28px 24px 24px;
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .logo-tile {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto;
        border-radius: 28px;
        border: 1px solid rgba(225, 198, 174, 0.8);
        background: linear-gradient(145deg, #fff7ef 0%, #ffe6d7 100%);
        display: grid;
        place-items: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }

      .logo-fallback {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
      }

      .logo-image {
        position: absolute;
        inset: 16px;
        border-radius: 18px;
        background-image: url("/icons/icon-192.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        box-shadow: 0 10px 22px rgba(87, 59, 39, 0.14);
      }

      .logo-alt {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .status-ring {
        width: 58px;
        height: 58px;
        margin: 18px auto 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #fce8de 0%, #f9ddcf 100%);
        display: grid;
        place-items: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      h1 {
        margin: 18px 0 0;
        font-size: clamp(2rem, 5vw, 2.35rem);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 900;
      }

      .message {
        margin: 14px auto 0;
        max-width: 31ch;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
        font-weight: 600;
      }

      .actions {
        margin-top: 24px;
      }

      .button {
        width: 100%;
        border: 0;
        border-radius: 20px;
        padding: 14px 18px;
        background: linear-gradient(180deg, #d97a57 0%, var(--brand) 100%);
        color: #fff;
        font: inherit;
        font-size: 0.96rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        box-shadow: 0 18px 30px rgba(201, 107, 72, 0.24);
        cursor: pointer;
      }

      .button:active {
        transform: translateY(1px);
      }

      .note {
        margin: 14px auto 0;
        max-width: 34ch;
        color: #9a8578;
        font-size: 0.86rem;
        line-height: 1.65;
        font-weight: 600;
      }

      .brand {
        margin-top: 18px;
        color: #b49a89;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      @media (max-width: 480px) {
        .card {
          padding: 24px 20px 20px;
          border-radius: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="offline-title">
        <div class="logo-tile" aria-hidden="true">
          <div class="logo-fallback">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="4" width="48" height="48" rx="16" fill="#FFF4EA" />
              <path
                d="M15 18.5L21.1 37L28 24.2L34.9 37L41 18.5"
                stroke="#C96B48"
                stroke-width="4.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="logo-image"></div>
          <img
            class="logo-alt"
            src="/icons/icon-192.png"
            alt="WebSerbisyo RSVP"
            width="56"
            height="56"
          />
        </div>
        <div class="status-ring" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3.5 9.4C6.47 6.71 10.13 5.25 14 5.25C17.87 5.25 21.53 6.71 24.5 9.4M6.55 13.05C8.77 11.1 11.3 10.12 14 10.12C16.7 10.12 19.23 11.1 21.45 13.05M10.15 16.85C11.23 16.01 12.57 15.56 14 15.56C15.43 15.56 16.77 16.01 17.85 16.85M13.96 21.08H14.04M4.2 4.2L23.8 23.8"
              stroke="#C96B48"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 id="offline-title">You&rsquo;re offline</h1>
        <p class="message">WebSerbisyo RSVP needs internet to sync your dashboard.</p>
        <div class="actions">
          <button class="button" type="button" id="retry-button">Try again</button>
        </div>
        <p class="note">Your dashboard will reconnect when your internet is back.</p>
        <p class="brand">WebSerbisyo RSVP</p>
      </section>
    </main>
    <script>
      const retryButton = document.getElementById("retry-button");

      if (retryButton) {
        retryButton.addEventListener("click", () => {
          window.location.reload();
        });
      }

      window.addEventListener("online", () => {
        window.location.assign("/dashboard");
      });
    </script>
  </body>
</html>
